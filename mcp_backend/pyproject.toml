[project]
name = "comsol-research-workflow-mcp"
version = "1.0.1"
description = "Optional local MCP backend for the COMSOL Research Workflow skill."
authors = [{name = "COMSOL Research Workflow contributors"}]
requires-python = ">=3.10"
dependencies = ["mcp>=1.29.0,<2", "mph>=1.4.0,<2", "numpy>=1.24", "uvicorn>=0.31"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
pdf-search = ["pymupdf>=1.24", "chromadb>=0.4", "sentence-transformers>=2.2"]

[project.scripts]
comsol-research-mcp = "server.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
